<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihnati - App</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Dependencies for local CV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>
  </head>
  <body class="app-body">
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Mihnati</h2>
        </div>
        <nav class="sidebar-nav">
          <a href="#dashboard" class="nav-item active" data-route="dashboard"
            >Dashboard</a
          >
          <a href="#profile" class="nav-item" data-route="profile"
            >Mon Profil</a
          >
          <a href="#upload" class="nav-item" data-route="upload"
            >Analyser mon CV</a
          >
          <a href="#skills" class="nav-item" data-route="skills"
            >Mes Compétences</a
          >
          <a href="#courses" class="nav-item" data-route="courses"
            >Formations</a
          >
          <a href="#opportunities" class="nav-item" data-route="opportunities"
            >Opportunités</a
          >
          <a href="#feedback" class="nav-item" data-route="feedback"
            >Feedback</a
          >
          <div class="nav-divider"></div>
          <a href="#settings" class="nav-item" data-route="settings"
            >Paramètres</a
          >
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="top-header">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <div class="header-user" id="header-user-greeting">Bonjour</div>
        </header>

        <div id="router-view" class="content-area">
          <!-- Content injected here by router.js -->
        </div>
      </main>
    </div>

    <!-- UI Components (Toasts, Modals) -->
    <div id="toast-container" class="toast-container"></div>

    <div id="global-loader" class="global-loader hidden">
      <div class="spinner"></div>
      <p id="loader-message">Chargement...</p>
    </div>

    <!-- Application Scripts -->
    <script src="js/data/sectors.js"></script>
    <script src="js/data/courses.js"></script>
    <script src="js/data/opportunities.js"></script>
    <script src="js/mock/mock-data.js"></script>
    <script src="js/ai/schema.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cache/search-cache.js"></script>

    <!-- Matching Engine -->
    <script src="js/matching/skill-matching.js"></script>
    <script src="js/matching/matching-engine.js"></script>
    <script src="js/matching/course-score.js"></script>

    <!-- AI & Search -->
    <script src="js/ai/providers/gemini-adapter.js"></script>
    <script src="js/ai/providers/openai-adapter.js"></script>
    <script src="js/ai/providers/provider-registry.js"></script>
    <script src="js/ai/providers/provider-detector.js"></script>
    <script src="js/ai/prompt-builder.js"></script>
    <script src="js/ai/ai-manager.js"></script>
    <script src="js/search/normalizer.js"></script>
    <script src="js/search/validator.js"></script>
    <script src="js/search/web-search.js"></script>

    <!-- Core -->
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/cv/pdf-parser.js"></script>
    <script src="js/cv/docx-parser.js"></script>
    <script src="js/cv/cv-upload.js"></script>

    <!-- Views (Stored as JS templates to avoid CORS on file:///) -->
    <script src="pages/views.js"></script>

    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
