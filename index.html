<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihnati - App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Dependencies for local CV parsing -->
    <script charset="UTF-8" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

    <script charset="UTF-8" src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>

  <body class="app-body">
    <div class="app-container">
      <!-- Sidebar -->
      
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="display:flex; align-items:center; gap:0.5rem; padding: 2rem 1.5rem 1rem 1.5rem;">
          <div style="width:32px; height:32px; background:var(--primary-gradient); border-radius:8px; display:flex; align-items:center; justify-content:center; color:white;">

          </div>
          <h2 style="font-size: 1.5rem; font-weight: 700; letter-spacing:0.5px;">Mihnati <span style="color:var(--primary-color);">✦</span></h2>
        </div>
        <nav class="sidebar-nav">
          <a href="#dashboard" class="nav-item active" data-route="dashboard">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
          </a>
          <a href="#profile" class="nav-item" data-route="profile">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Mon Profil
          </a>
          <a href="#upload" class="nav-item" data-route="upload">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Analyser mon CV

            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Mes Compétences
          </a>
          <a href="#courses" class="nav-item" data-route="courses">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>
            Formations
          </a>
          <a href="#opportunities" class="nav-item" data-route="opportunities">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>

            Feuille de route
          </a>
          <a href="#feedback" class="nav-item" data-route="feedback">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            Feedback
          </a>
          <div class="nav-divider"></div>
          <a href="#settings" class="nav-item" data-route="settings">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Paramètres
          </a>
        </nav>
        
        <div class="sidebar-promo">
            <div class="promo-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            </div>
            <h4>Mihnati</h4>
            <p>L'IA au service de votre carrière</p>
            <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">v1.2.0-secure</p>
        </div>
      </aside>

      
      <!-- Main Content -->
      <main class="main-content">
        <header class="top-header">
          <div style="display:flex; align-items:center;">
             <button class="menu-toggle" id="menu-toggle">☰</button>
             <div class="header-user" id="header-user-greeting" style="font-weight: 600; font-size:1.1rem;">Bonjour</div>
          </div>
          
          <div class="header-actions">
             <div class="search-box">
                <svg width="18" height="18" fill="none" stroke="#9ca3af" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" placeholder="Rechercher...">
             </div>
             <button class="icon-btn" style="position:relative;">
                <svg width="22" height="22" fill="none" stroke="#4b5563" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span style="position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:var(--red); border-radius:50%; border:2px solid white;"></span>
             </button>
             <div class="user-profile">
                <div class="avatar">A</div>
                <span class="avatar-name">Abdessamad</span>
                <svg width="16" height="16" fill="none" stroke="#4b5563" viewBox="0 0 24 24" style="margin-left:4px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
             </div>
          </div>
        </header>

        <div id="router-view" class="content-area">
          <!-- Content injected here by router.js -->
        </div>
      </main>
    </div>

    <!-- UI Components (Toasts, Modals) -->
    <div id="toast-container" class="toast-container"></div>

    <div id="global-loader" class="global-loader hidden">
      <div class="spinner"></div>
      <p id="loader-message">Chargement...</p>
    </div>

    <script charset="UTF-8" src="js/data/sectors.js"></script>

    <script charset="UTF-8" src="js/data/opportunities.js"></script>
    <!-- Demo & Mock -->
    <script charset="UTF-8" src="js/demo/demo-data.js"></script>
    <script charset="UTF-8" src="js/demo/demo-state.js"></script>
    <script charset="UTF-8" src="js/demo/demo-service.js"></script>
    <script charset="UTF-8" src="js/mock/mock-data.js"></script>
    <script charset="UTF-8" src="js/ai/schema.js"></script>

    <script charset="UTF-8" src="js/utils/api-fetch.js"></script>
    <script charset="UTF-8" src="js/ai/providers/gemini-adapter.js"></script>

    <script charset="UTF-8" src="js/ai/providers/cohere-adapter.js"></script>

    <script charset="UTF-8" src="js/ai/providers/provider-detector.js"></script>
    <script charset="UTF-8" src="js/ai/response-normalizer.js"></script>
    <script charset="UTF-8" src="js/ai/prompt-builder.js"></script>
    <script charset="UTF-8" src="js/ai/ai-manager.js"></script>
    <script charset="UTF-8" src="js/search/normalizer.js"></script>
    <script charset="UTF-8" src="js/search/validator.js"></script>
    <script charset="UTF-8" src="js/search/web-search.js"></script>

    <!-- Core -->
    <script charset="UTF-8" src="js/ui/toast.js"></script>

    <script charset="UTF-8" src="js/app.js"></script>
  </body>
</html>
